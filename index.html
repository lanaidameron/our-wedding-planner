<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Our Wedding Planner</title>
<style>
:root{--ink:#174f4b;--ink2:#123f3c;--mint:#e6f3ef;--gold:#b78a35;--paper:#fffdf8;--line:#d8e1dd;--muted:#687875;--white:#fff;--shadow:0 8px 28px rgba(20,75,70,.08)}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#263936;font-size:18px}.top{position:sticky;top:0;z-index:10;background:rgba(255,253,248,.97);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px}.brand{font-weight:900;color:var(--ink);font-size:22px;flex:1}.tabs{display:flex;gap:8px}.tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:12px 20px;font-weight:800;font-size:17px}.tab.active{background:var(--ink);color:#fff}.wrap{max-width:720px;margin:auto;padding:28px 20px 110px}.eyebrow{color:var(--gold);font-weight:900;letter-spacing:.13em;text-transform:uppercase;font-size:15px}.hero{font-size:42px;line-height:1.02;color:var(--ink);margin:8px 0 4px;font-weight:950}.subhero{font-size:27px;color:var(--ink);font-weight:800;margin:0 0 26px}.h1{font-size:34px;line-height:1.1;color:var(--ink);font-weight:900;margin:8px 0 14px}.h2{font-size:23px;color:var(--ink);font-weight:850;margin:18px 0 8px}.lead{font-size:20px;line-height:1.45;color:#4d615e}.small{font-size:15px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;margin:14px 0;box-shadow:var(--shadow)}button.card{width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}.card strong{display:block;color:var(--ink);font-size:20px;margin-bottom:5px}.choice{width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin:9px 0;text-align:left;font:inherit;color:#263936;cursor:pointer}.choice.selected{background:var(--mint);border:3px solid var(--ink);padding:16px 18px}.choice .tag{float:right;font-size:13px;font-weight:900;color:var(--ink)}.primary,.secondary,.back{width:100%;border-radius:20px;padding:17px 18px;margin:12px 0;font-size:17px;font-weight:900;cursor:pointer}.primary{background:var(--ink);color:#fff;border:2px solid var(--ink)}.secondary{background:var(--mint);color:var(--ink);border:2px solid transparent}.back{background:#fff;color:var(--ink);border:1px solid var(--line)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{width:100%;padding:16px;border:1px solid #cbd8d4;border-radius:15px;font:inherit;margin:7px 0 14px;background:#fff}.label{font-weight:800;color:var(--ink);display:block;margin-top:12px}.notice{border-left:5px solid var(--gold);background:#f7faf8;padding:16px;border-radius:12px;margin:18px 0;color:#526562}.photo{height:250px;border:2px dashed #cbd8d4;border-radius:24px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:#fff;margin:18px 0;cursor:pointer}.photo img{width:100%;height:100%;object-fit:cover}.summary{border-left:4px solid var(--mint);padding:8px 0 8px 16px;margin:12px 0}.summary b{color:var(--ink)}.pill{display:inline-block;background:var(--mint);color:var(--ink);font-weight:800;border-radius:999px;padding:7px 11px;margin:4px 4px 4px 0;font-size:14px}.statusbar{background:#f7faf8;border-radius:16px;padding:13px 15px;margin:12px 0;color:var(--ink);font-weight:750}.done-card{background:var(--mint);border:2px solid var(--ink)}.done-card .step-state{font-weight:900;color:var(--ink)}.bottom-note{text-align:center;color:var(--muted);font-size:14px;margin-top:22px}.hidden{display:none}@media(max-width:480px){.wrap{padding:24px 18px 105px}.hero{font-size:39px}.h1{font-size:31px}.tab{padding:11px 16px}.row{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="brand">OUR WEDDING 💚</div><div class="tabs" id="tabs"><button class="tab" data-mode="home">Home</button><button class="tab" data-mode="dream">Dream</button><button class="tab" data-mode="plan">Plan</button></div></header><main class="wrap" id="app"></main><input id="photoInput" type="file" accept="image/*" class="hidden">
<script>
'use strict';
const KEY='ourWeddingFinalV1';
const fresh=()=>({onboard:false,people:{a:'',alabel:'Bride',acustom:'',b:'',blabel:'Partner',bcustom:''},date:'',dateUnknown:false,dateIdea:'',area:'',areaUnknown:false,size:'',budget:'',budgetUnknown:false,photo:'',mode:'landing',route:'welcome',lastDream:'dreamHome',lastPlan:'planHome',lastHome:'plannerHome',history:[],guestEstimate:'',dream:{},considering:{},chosen:{},mix:{},explore:{},events:{},plan:{money:{planned:'',committed:'',paid:'',outstanding:'',upcoming:''},handling:{}}});
let state;try{state=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){state=fresh()}
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(state));
  }catch(e){
    // Some phone file viewers block localStorage for local HTML files.
    // Keep the planner interactive even when persistent browser storage is unavailable.
  }
}
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function title(t,sub='',eye=''){return `${eye?`<div class="eyebrow">${eye}</div>`:''}<div class="h1">${t}</div>${sub?`<div class="lead">${sub}</div>`:''}`}
function btn(label,action,kind='primary'){return `<button class="${kind}" data-action="${action}">${label}</button>`}
function back(){return state.history.length?btn('← BACK','back','back'):''}
function choice(label,key,selected=false,multi=false){return `<button class="choice ${selected?'selected':''}" data-choice="${esc(key)}" aria-pressed="${selected}">${esc(label)}${selected?`<span class="tag">${multi?'SELECTED':'✓'}</span>`:''}</button>`}
function card(label,desc,route){return `<button class="card" data-route="${route}"><strong>${label}</strong>${desc?`<span>${desc}</span>`:''}</button>`}
function go(route,{push=true,mode=null}={}){if(push&&state.route!==route)state.history.push({route:state.route,mode:state.mode});state.route=route;if(mode)state.mode=mode;if(state.mode==='dream')state.lastDream=route;if(state.mode==='plan')state.lastPlan=route;if(state.mode==='home')state.lastHome=route;save();render()}
function switchMode(mode){
 if(mode==='home'){
  if(state.mode==='dream')state.lastDream=state.route;
  if(state.mode==='plan')state.lastPlan=state.route;
  state.history=[];state.mode='home';return go('plannerHome',{push:false,mode:'home'});
 }
 if(state.mode===mode){go(mode==='dream'?'dreamHome':'planHome',{push:true,mode});return}
 if(state.mode==='dream')state.lastDream=state.route;
 if(state.mode==='plan')state.lastPlan=state.route;
 state.history=[];state.mode=mode;
 go(mode==='dream'?(state.lastDream||'dreamHome'):(state.lastPlan||'planHome'),{push:false,mode})
}
function doBack(){const p=state.history.pop();if(p){state.route=p.route;state.mode=p.mode;save();render()}}
const dreamSteps=['ceremonyLocation','timeOfDay','ceremonyFeel','ceremonySurroundings','gettingReady','attire','firstLook','entrance','ceremonyContents','celebration'];
const options={
 ceremonyLocation:['A wedding venue','A place of worship','A courthouse','Outdoors','At someone’s home','A restaurant, hotel, or event space','Somewhere else','I don’t know yet'],
 timeOfDay:['Morning','Afternoon','Around sunset','Evening','Late night','I’m not sure yet'],
 ceremonyFeel:['Romantic & emotional','Relaxed & easygoing','Elegant & polished','Fun & full of personality','Traditional & meaningful','Simple & intimate','A mix of these','I’m not sure yet'],
 ceremonySurroundings:['Flowers or greenery','Candles or beautiful lighting','An arch or something framing us','A beautiful view or natural setting','A space that’s beautiful on its own','Something meaningful or personal to us','A mix of these','I want to play','I haven’t pictured this part yet'],
 gettingReady:["What I’m wearing",'Shoes & accessories','Hair','Makeup / grooming',"Who I’m getting ready with","Where I’m getting ready",'Honestly, all of it','I want to play','I haven’t pictured this part yet'],
 attire:['Gown / dress','Suit / tux','Jumpsuit','Separates','Cultural / traditional attire','Something unconventional','More than one look','I want to play','I haven’t pictured this part yet'],
 firstLook:['See each other for the first time at the ceremony','A private first look','A first touch without seeing each other','Spend time together before the ceremony','Something different','I want to play','I haven’t pictured this part yet'],
 entrance:['Walk down an aisle','Enter together','Already be there','Something different','I want to play','I haven’t pictured this part yet'],
 ceremonyContents:['Vows','Rings','A reading','Music','A tradition','Something symbolic or personal','Simple and private','I want to explore','I haven’t pictured this part yet'],
 celebration:['A big reception / party','Dinner and celebrate','Relaxed and casual','Small and intimate','Just us','Something different','I want to play','I haven’t pictured this part yet']};
const labels={ceremonyLocation:['CEREMONY','Let’s start with the moment you get married. 💚','Where are you imagining your ceremony?'],timeOfDay:['CEREMONY','When you picture getting married, what time of day is it? 💚',''],ceremonyFeel:['CEREMONY','When you picture the ceremony, what does it feel like? 💚',''],ceremonySurroundings:['CEREMONY','When you picture the place where you say your vows, what do you see around you? 💚',''],gettingReady:['GETTING READY','When you picture yourself getting ready to get married… 💚','What have you imagined so far?'],attire:['YOUR LOOK','What do you picture yourself wearing? 💚','There is no one right way to look like someone getting married.'],firstLook:['BEFORE THE CEREMONY','When do you picture seeing each other? 💚',''],entrance:['THE CEREMONY','How do you picture arriving at the moment you get married? 💚',''],ceremonyContents:['THE CEREMONY','What do you picture being part of the ceremony? 💚','Choose as many as feel right.'],celebration:['YOU’RE MARRIED 💚','What happens next?','Picture the celebration that feels like yours.']};
const multiKeys=new Set(['gettingReady','ceremonyContents']);
const uncertain=s=>/don’t know|don't know|not sure|haven’t pictured|haven't pictured/i.test(s);
const play=s=>/play|explore/i.test(s);
function onboarding(route){
 if(route==='welcome')return `<div class="eyebrow">OUR WEDDING</div><div class="hero">I SAID YES!</div><div class="subhero">...now what?</div><div class="lead">You don’t have to know everything yet.<br>Let’s start with your wedding. 💚</div>${btn('MAKE IT OURS →','nextPeople')}`;
 if(route==='people')return `${title('First things first…','Who is getting married?')}<label class="label">Your name</label><input class="field" id="a" value="${esc(state.people.a)}"><label class="label">What would you like us to call you?</label><select class="field" id="alabel">${['Bride','Groom','Spouse','Partner','Custom'].map(x=>`<option ${state.people.alabel===x?'selected':''}>${x}</option>`).join('')}</select><input class="field ${state.people.alabel==='Custom'?'':'hidden'}" id="acustom" placeholder="Your custom title" value="${esc(state.people.acustom||'')}"><label class="label">Who are you marrying?</label><input class="field" id="b" value="${esc(state.people.b)}"><label class="label">What would you like us to call them?</label><select class="field" id="blabel">${['Bride','Groom','Spouse','Partner','Custom'].map(x=>`<option ${state.people.blabel===x?'selected':''}>${x}</option>`).join('')}</select><input class="field ${state.people.blabel==='Custom'?'':'hidden'}" id="bcustom" placeholder="Their custom title" value="${esc(state.people.bcustom||'')}">${btn('CONTINUE','savePeople')}${back()}`;
 if(route==='date')return `${title('When’s the big day? 💚')}<label class="label">Wedding date</label><input class="field" type="date" id="date" value="${esc(state.date)}"><label><input type="checkbox" id="dateUnknown" ${state.dateUnknown?'checked':''}> We’re still deciding</label><label class="label">General idea, if you have one</label><input class="field" id="dateIdea" placeholder="Season / month / year / not yet" value="${esc(state.dateIdea)}"><div class="small">Whatever you know right now is enough. You can change it anytime.</div>${btn('CONTINUE','saveDate')}${back()}`;
 if(route==='area')return `${title('Where are you imagining your wedding?')}<label class="label">City / Area</label><input class="field" id="area" value="${esc(state.area)}"><label><input type="checkbox" id="areaUnknown" ${state.areaUnknown?'checked':''}> We’re still deciding</label><div class="small">An approximate location is perfect. We just need a starting point.</div>${btn('CONTINUE','saveArea')}${back()}`;
 if(route==='size')return `${title('When you picture your wedding, how big does it feel?')}<div data-group="size">${['Small & intimate','Somewhere in the middle','A big celebration','I’m not sure yet'].map(x=>choice(x,x,state.size===x)).join('')}</div><div class="small">You can change your mind anytime.</div>${btn('CONTINUE','saveSize')}${back()}`;
 if(route==='budget')return `${title('What are you comfortable planning to spend?')}<label class="label">Wedding budget</label><input class="field" id="budget" inputmode="numeric" placeholder="$" value="${esc(state.budget)}"><label><input type="checkbox" id="budgetUnknown" ${state.budgetUnknown?'checked':''}> We don’t know yet</label><div class="notice">Whatever your number, we’ll help you plan the wedding you want to experience. 💚</div>${btn('CONTINUE','saveBudget')}${back()}`;
 if(route==='onboardDone')return `${title('Look at you. You’re planning a wedding. 💚','That’s enough for now. We’ll ask for other details when they actually become useful. You don’t need to figure everything out today.')}${btn('SEE OUR WEDDING →','finishOnboard')}${back()}`;
}
function landing(){let countdown='';if(state.date&&!state.dateUnknown){const d=new Date(state.date+'T12:00:00'),now=new Date();const days=Math.ceil((d-now)/(86400000));countdown=days>=0?`<div class="eyebrow">${days} DAYS UNTIL WE GET MARRIED</div>`:`<div class="eyebrow">YOU DID IT! 💚</div>`}const names=[state.people.a,state.people.b].filter(Boolean).join(' & ')||'Our Wedding';return `${title('I SAID YES!','...now what?')}<div class="lead">You don’t have to know everything yet. Let’s start with your wedding. 💚</div><div class="photo" id="photoBox">${state.photo?`<img src="${state.photo}" alt="Wedding inspiration photo">`:'+ Add a photo that makes this feel like your wedding 💚'}</div>${countdown}<div class="h1">${esc(names)}</div>${state.date&&!state.dateUnknown?`<div class="lead">${new Date(state.date+'T12:00:00').toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}</div>`:''}${btn('ENTER OUR WEDDING PLANNER →','enterHome')}${btn('USE OUR WEDDING GUIDE →','guideInfo','secondary')}<div class="bottom-note">We’ll hold the details so you can experience your wedding.</div>`}
function guideInfo(){return `${title('Our Wedding Guide','The Guide teaches. The Planner tracks.','GUIDE + PLANNER')}<div class="card"><strong>Use the Guide when you need context.</strong><span>Open your copy of <em>Our Wedding Guide</em> whenever you want explanations, questions to ask, or help understanding a decision. Then come right back here to record what you’re considering or what you’ve decided.</span></div><div class="notice">Your planner does not duplicate or pretend to open the book. Your Guide is the copy that came with your purchase.</div><button class="secondary" data-mode="home">BACK TO PLANNER HOME →</button>${back()}`}
function dreamHome(){return `${title('Let’s picture your wedding. 💚','Explore anything you want. Looking is not deciding, and you can move between Dream and Plan whenever you want.')} ${card('Our Wedding Day','Picture the moment you get married and the celebration around it.','ceremonyLocation')}${card('Before the Wedding','Engagements, showers, celebrations, rehearsals, welcome gatherings, or your own thing.','beforeHome')}${card('After the Wedding','After-parties, brunches, honeymoons, mini-moons, staycations, or your own thing.','afterHome')}`}
function commitBlock(key,val){if(!val||uncertain(val)||play(val)||val==='A mix of these')return '';const c=state.considering[key]===val, ch=state.chosen[key]===val;return `<div class="row">${btn(c?'CONSIDERING ✓':'CONSIDERING',`consider:${key}`,'secondary')}${btn(ch?'YEP, THIS 💚 ✓':'YEP, THIS 💚',`choose:${key}`)}</div>`}
function standardDream(key){const [eye,h,sub]=labels[key];const isMulti=multiKeys.has(key);const vals=isMulti?(state.dream[key]||[]):state.dream[key];let body=options[key].map(o=>choice(o,o,isMulti?vals.includes(o):vals===o,isMulti)).join('');let guide=key==='ceremonyLocation'?`<div class="notice">Not sure what your options are? Your Wedding Guide explains different ceremony locations and what becomes useful to know with each.</div>${btn('EXPLORE CEREMONY LOCATIONS IN OUR GUIDE →','guideInfo','secondary')}`:'';let commit=!isMulti?commitBlock(key,vals):'';return `${title(h,sub,eye)}${body}${guide}${commit}${btn(key==='celebration'?'SEE THE DREAM MENU →':'KEEP IMAGINING OUR WEDDING →',`advance:${key}`)}${back()}`}
function playScreen(topic){const plays={ceremonySurroundings:['Flowers everywhere','Mostly greenery','Candlelight','An architectural frame','A dramatic view','A room that needs almost nothing','Personal details tucked in'],gettingReady:['A quiet morning','A room full of people I love','Music playing','Matching pajamas / getting-ready clothes','Coffee or breakfast together','A private moment before everything starts','Getting ready with my partner'],attire:['Gown / dress','Suit / tux','Jumpsuit','Separates','Cultural / traditional attire','Something unconventional','More than one look','Accessories that feel like me'],firstLook:['Private first look','First touch','Read letters without seeing each other','Spend the morning together','Wait for the ceremony','Do something completely our own'],entrance:['Walk the aisle alone','Walk with someone important','Walk with more than one person','Enter together','Meet partway','Already be there','Something unexpected'],celebration:['Big dance floor','Long dinner','Cocktail-party energy','Backyard-style hangout','Tiny candlelit dinner','Live music','Games / entertainment','Just us disappearing together'],ceremonyContents:['Personal vows','Traditional vows','A meaningful reading','Live music','A family or cultural tradition','A symbolic ritual','A private moment']};const arr=plays[topic]||['Something personal','Something simple','Something unexpected','A mix of ideas'];const vals=state.explore[topic]||[];return `${title('Let’s play with this. 💚','Tap anything that makes you curious. This is exploring — nothing here becomes a task.','DREAM')}${arr.map(x=>choice(x,x,vals.includes(x),true)).join('')}${btn('KEEP THESE IDEAS & GO BACK →',`playDone:${topic}`)}${back()}`}
function mixScreen(topic){const base=options[topic].filter(x=>x!=='A mix of these'&&!uncertain(x)&&!play(x));const vals=state.mix[topic]?.selected||[];return `${title('What belongs in your mix? 💚','Choose as many as you want. We’ll walk through each one you select.','A MIX')}${base.map(x=>choice(x,x,vals.includes(x),true)).join('')}${btn('SHOW ME EACH ONE →',`mixStart:${topic}`)}${back()}`}
function mixDetail(topic){const m=state.mix[topic]||{selected:[],index:0};const item=m.selected[m.index];if(!item)return `${title('Choose at least one thing for your mix.','Go back and tap the pieces you want to explore.')}${back()}`;const ideas={
'Romantic & emotional':['Personal vows','A meaningful song','A private moment together','A reading that matters to us'], 'Fun & full of personality':['Unexpected music','A playful entrance','A tradition made our own','Something guests will remember'], 'Elegant & polished':['A beautiful entrance','Intentional music','Refined details','A setting that feels considered'], 'Relaxed & easygoing':['Short and natural','Laughing is welcome','Less formality','Guests feel comfortable'], 'Traditional & meaningful':['Traditional vows','A meaningful ritual','Classic processional','Family or cultural tradition'], 'Simple & intimate':['Only the essential moments','Small group','Quiet setting','Very little production'],
'Flowers or greenery':['Loose garden flowers','Mostly greenery','Wildflowers','Aisle flowers','Ground arrangements'],'Candles or beautiful lighting':['Lots of candles','Lanterns','String lights','Warm ambient light','Natural light'],'An arch or something framing us':['Floral arch','Greenery arch','Fabric draping','Wooden structure','Minimal frame'],'A beautiful view or natural setting':['Water','Mountains','Trees or woods','Garden','Open sky','City view'],"A space that's beautiful on its own":['Historic architecture','Grand room','Modern space','Restaurant or hotel interior','Very little added décor'],'Something meaningful or personal to us':['Family photos','Heirlooms','Something handmade','A cultural element','A detail only we understand']};const vals=state.explore[`mix:${topic}:${item}`]||[];return `${title(item,'Play with this piece of your mix. Nothing becomes a decision unless you choose it.','YOUR MIX')}<div class="statusbar">${m.index+1} of ${m.selected.length}</div>${(ideas[item]||['Show me more of this','Keep it simple','Make it personal','Something unexpected']).map(x=>choice(x,x,vals.includes(x),true)).join('')}${btn(m.index<m.selected.length-1?'NEXT PART OF MY MIX →':'FINISH MY MIX →',`mixNext:${topic}`)}${back()}`}
const beforeEvents=[['engagement','Engagement party'],['shower','Wedding / bridal shower'],['bach','Bachelor / bachelorette celebration(s)'],['welcome','Welcome party'],['rehearsal','Rehearsal'],['rehearsalDinner','Rehearsal dinner / gathering'],['tradition','Family / cultural / traditional celebration'],['customBefore','Create our own']];
const afterEvents=[['afterparty','After-party'],['farewell','Farewell breakfast / brunch'],['honeymoon','Honeymoon'],['minimoon','Mini-moon'],['staycation','Romantic staycation'],['customAfter','Create our own']];
function eventHome(which){const arr=which==='before'?beforeEvents:afterEvents;return `${title(which==='before'?'What happens before the wedding? 💚':'What happens after the wedding? 💚','Explore anything that sounds like your wedding. Having an event does not mean you have to be the one planning it.',which==='before'?'BEFORE THE WEDDING':'AFTER THE WEDDING')}${arr.map(([id,n])=>card(n,'Tap to explore without assuming you’re responsible for planning it.',`event:${id}`)).join('')}${back()}`}
function eventScreen(id){const all=[...beforeEvents,...afterEvents];const name=(all.find(x=>x[0]===id)||[])[1]||'Our event';if(id==='staycation')return staycation();const e=state.events[id]||{};const ownOpts=['We’re planning it','We’re planning it with someone','Someone else is planning it','We know we’re having it, but details are still fuzzy','We’re just thinking about it','Not interested'];const helpOpts=['When','Where','Who’s invited','Food & drinks','What we’ll do','Look & feel','What we need to bring / wear','Other','Pretty much handled'];return `${title(name,'First: where does this fit for you?','EXPLORE')}<div class="h2">Are we having this?</div>${ownOpts.map(x=>choice(x,x,e.owner===x)).join('')}${e.owner&&e.owner!=='Not interested'&&!/thinking|fuzzy/i.test(e.owner)?`<div class="h2">What do we actually need help with?</div>${helpOpts.map(x=>choice(x,x,(e.help||[]).includes(x),true)).join('')}`:''}${e.owner==='Someone else is planning it'?`<div class="notice">We’ll only hold the pieces that matter to you. Unknown host details will not become your tasks.</div>`:''}${btn('SAVE & RETURN →',`eventDone:${id}`)}${back()}`}
function staycation(){const e=state.events.staycation||{};const ideas=['A beautiful local hotel','A home retreat','Fancy dinners / date nights','Spa time','Be tourists in our own city','Day trips','Order in and disappear','Movies, games, books & nowhere to be','Surprises for each other','A mix of home and going out','Something completely ours'];return `${title('Romantic staycation 💚','An intentional celebration. Not a consolation prize.','AFTER THE WEDDING')}<div class="lead">What sounds deliciously like the two of you?</div>${ideas.map(x=>choice(x,x,(e.help||[]).includes(x),true)).join('')}${btn('SAVE THESE IDEAS →','eventDone:staycation')}${back()}`}


function parseDateValue(v){
 if(!v)return null;
 if(/^\d{4}-\d{2}-\d{2}$/.test(v)){const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d,12)}
 const x=new Date(v);return isNaN(x)?null:x
}
function dateOnly(d){return d?d.toLocaleDateString(undefined,{month:'short',day:'numeric'}):''}
function daysFromToday(d){if(!d)return null;const a=new Date();a.setHours(12,0,0,0);const b=new Date(d);b.setHours(12,0,0,0);return Math.ceil((b-a)/86400000)}
function relativeDue(v,kind='due'){
 const d=parseDateValue(v);if(!d)return '';
 const n=daysFromToday(d);
 if(kind==='recommended')return n<0?'Ready when you are 💚':`Best done by ${dateOnly(d)}`;
 if(n<0)return `Past due · ${dateOnly(d)}`;
 if(n===0)return `Today · ${dateOnly(d)}`;
 if(n===1)return `Tomorrow · ${dateOnly(d)}`;
 if(n<=30)return `in ${n} days · ${dateOnly(d)}`;
 return `Due ${dateOnly(d)}`
}
function weddingDays(){if(!state.date||state.dateUnknown)return null;return daysFromToday(parseDateValue(state.date))}
function inviteRecommendation(){if(!state.date||state.dateUnknown)return null;const d=parseDateValue(state.date);d.setDate(d.getDate()-56);return d}

function bind(){document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>switchMode(x.dataset.mode));document.querySelectorAll('[data-route]').forEach(x=>x.onclick=()=>{const r=x.dataset.route;const m=r.startsWith('plan')?'plan':(r==='plannerHome'||r==='whatsLeft'||r==='alreadyAccomplished'?'home':null);go(r,{mode:m})});document.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>act(x.dataset.action));document.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>selectChoice(x.dataset.choice));document.querySelectorAll('[data-plan-toggle]').forEach(x=>x.onclick=()=>togglePlanStep(x.dataset.planToggle));document.querySelectorAll('[data-plan-choice]').forEach(x=>x.onclick=()=>selectPlanChoice(x.dataset.planChoice,x.dataset.planValue));document.querySelectorAll('[data-stuff-open]').forEach(x=>x.onclick=()=>openStuffItem(x.dataset.stuffOpen));document.querySelectorAll('[data-stuff-method]').forEach(x=>x.onclick=()=>setStuffMethod(x.dataset.stuffMethod));const addStuff=$('#addStuffItem');if(addStuff)addStuff.onclick=addStuffItem;const saveStuff=$('#saveStuffItem');if(saveStuff)saveStuff.onclick=saveStuffItem;const al=$('#alabel'),bl=$('#blabel'),ac=$('#acustom'),bc=$('#bcustom');if(al&&ac)al.onchange=()=>ac.classList.toggle('hidden',al.value!=='Custom');if(bl&&bc)bl.onchange=()=>bc.classList.toggle('hidden',bl.value!=='Custom');const pb=$('#photoBox');if(pb)pb.onclick=()=>$('#photoInput').click();document.querySelectorAll('.money').forEach(x=>x.oninput=calcMoney)}
function selectChoice(v){const r=state.route;if(r==='size'){state.size=v;save();render();return}if(r.startsWith('play:')){const k=r.split(':')[1],a=state.explore[k]||[];state.explore[k]=a.includes(v)?a.filter(x=>x!==v):[...a,v];save();render();return}if(r.startsWith('mix:')){const k=r.split(':')[1];state.mix[k]??={selected:[],index:0};let a=state.mix[k].selected;state.mix[k].selected=a.includes(v)?a.filter(x=>x!==v):[...a,v];save();render();return}if(r.startsWith('mixDetail:')){const k=r.split(':')[1],m=state.mix[k],item=m.selected[m.index],ek=`mix:${k}:${item}`,a=state.explore[ek]||[];state.explore[ek]=a.includes(v)?a.filter(x=>x!==v):[...a,v];save();render();return}if(r.startsWith('event:')){const id=r.split(':')[1];state.events[id]??={};if(id==='staycation'){let a=state.events[id].help||[];state.events[id].help=a.includes(v)?a.filter(x=>x!==v):[...a,v]}else{const ownerOpts=['We’re planning it','We’re planning it with someone','Someone else is planning it','We know we’re having it, but details are still fuzzy','We’re just thinking about it','Not interested'];if(ownerOpts.includes(v))state.events[id].owner=v;else{let a=state.events[id].help||[];state.events[id].help=a.includes(v)?a.filter(x=>x!==v):[...a,v]}}save();render();return}if(multiKeys.has(r)){let a=state.dream[r]||[];if(play(v)){go(`play:${r}`);return}state.dream[r]=a.includes(v)?a.filter(x=>x!==v):[...a,v];save();render();return}if(play(v)){go(`play:${r}`);return}if(v==='A mix of these'){state.dream[r]=v;state.mix[r]??={selected:[],index:0};save();go(`mix:${r}`);return}state.dream[r]=v;save();render()}
function act(a){if(a==='back')return doBack();if(a==='nextPeople')return go('people');if(a==='savePeople'){state.people.a=$('#a').value.trim();state.people.b=$('#b').value.trim();state.people.alabel=$('#alabel').value;state.people.blabel=$('#blabel').value;state.people.acustom=state.people.alabel==='Custom'?($('#acustom')?.value.trim()||''):'';state.people.bcustom=state.people.blabel==='Custom'?($('#bcustom')?.value.trim()||''):'';save();return go('date')}if(a==='saveDate'){state.date=$('#date').value;state.dateUnknown=$('#dateUnknown').checked;state.dateIdea=$('#dateIdea').value.trim();save();return go('area')}if(a==='saveArea'){state.area=$('#area').value.trim();state.areaUnknown=$('#areaUnknown').checked;save();return go('size')}if(a==='saveSize')return go('budget');if(a==='saveBudget'){state.budget=$('#budget').value.trim();state.budgetUnknown=$('#budgetUnknown').checked;save();return go('onboardDone')}if(a==='finishOnboard'){state.onboard=true;state.mode='landing';state.route='landing';state.lastDream='dreamHome';state.lastPlan='planHome';state.lastHome='plannerHome';state.history=[];save();return render()}if(a==='enterHome'){state.mode='home';state.history=[];return go('plannerHome',{push:false,mode:'home'})}if(a==='guideInfo')return go('guideInfo');if(a==='enterDream'){state.mode='dream';state.history=[];return go(state.lastDream||'dreamHome',{push:false,mode:'dream'})}if(a==='enterPlan'){state.mode='plan';state.history=[];return go(state.lastPlan||'planHome',{push:false,mode:'plan'})}if(a.startsWith('consider:')){const k=a.split(':')[1],v=state.dream[k];state.considering[k]=state.considering[k]===v?'':v;if(state.considering[k])state.chosen[k]='';save();return render()}if(a.startsWith('choose:')){const k=a.split(':')[1],v=state.dream[k];state.chosen[k]=state.chosen[k]===v?'':v;if(state.chosen[k])state.considering[k]='';save();return render()}if(a.startsWith('advance:')){const k=a.split(':')[1];if(k==='celebration')return go('dreamHome');const i=dreamSteps.indexOf(k);return go(dreamSteps[i+1])}if(a.startsWith('playDone:'))return doBack();if(a.startsWith('mixStart:')){const k=a.split(':')[1];state.mix[k]??={selected:[],index:0};if(!state.mix[k].selected.length){alert('Choose at least one part of your mix first.');return}state.mix[k].index=0;save();return go(`mixDetail:${k}`)}if(a.startsWith('mixNext:')){const k=a.split(':')[1],m=state.mix[k];if(m.index<m.selected.length-1){m.index++;save();return render()}state.dream[k]='A mix of these';save();state.history=state.history.filter(h=>!h.route.startsWith('mixDetail:')&&!h.route.startsWith('mix:'));return go(k,{push:false,mode:'dream'})}if(a.startsWith('eventDone:')){const id=a.split(':')[1];save();return go(beforeEvents.some(x=>x[0]===id)?'beforeHome':'afterHome')}if(a==='saveGuests'){state.guestEstimate=$('#guestEstimate').value.trim();save();return render()}if(a==='saveMoney'){document.querySelectorAll('.money').forEach(x=>state.plan.money[x.dataset.money]=x.value.trim());save();return render()}}
function calcMoney(){const els=[...document.querySelectorAll('.money')];if(!els.length)return;const vals={};els.forEach(x=>vals[x.dataset.money]=Number((x.value||'').replace(/[^0-9.-]/g,''))||0);const base=Number((state.budget||'').replace(/[^0-9.-]/g,''))||0;const u=Math.max(0,base-vals.committed);const el=$('#uncommitted');if(el)el.textContent=base?u.toLocaleString(undefined,{style:'currency',currency:'USD'}):'Add a planning budget to calculate'}
$('#photoInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.photo=r.result;save();render()};r.readAsDataURL(f)});
if(state.onboard&&state.route==='welcome'){state.route='landing';state.mode='landing'}render();
</script></body></html>
