<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Our Wedding Planner</title>
<style>
:root{--ink:#174f4b;--ink2:#123f3c;--mint:#e6f3ef;--gold:#b78a35;--paper:#fffdf8;--line:#d8e1dd;--muted:#687875;--white:#fff;--danger:#9b2c2c;--shadow:0 8px 28px rgba(20,75,70,.08)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#263936;font-size:18px}.top{position:sticky;top:0;z-index:10;background:rgba(255,253,248,.97);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}.brand{font-weight:900;color:var(--ink);font-size:20px;flex:1}.tabs{display:flex;gap:6px}.tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:11px 15px;font-weight:800;font-size:15px;min-height:44px}.tab.active{background:var(--ink);color:#fff}.wrap{max-width:760px;margin:auto;padding:26px 18px calc(110px + env(safe-area-inset-bottom))}.eyebrow{color:var(--gold);font-weight:900;letter-spacing:.13em;text-transform:uppercase;font-size:14px;margin-top:8px}.hero{font-size:42px;line-height:1.02;color:var(--ink);margin:8px 0 4px;font-weight:950}.subhero{font-size:27px;color:var(--ink);font-weight:800;margin:0 0 26px}.h1{font-size:34px;line-height:1.1;color:var(--ink);font-weight:900;margin:8px 0 14px}.h2{font-size:23px;color:var(--ink);font-weight:850;margin:22px 0 8px}.lead{font-size:20px;line-height:1.45;color:#4d615e}.small{font-size:14px;color:var(--muted);line-height:1.4}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin:13px 0;box-shadow:var(--shadow)}button.card{width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;min-height:58px}.card strong{display:block;color:var(--ink);font-size:20px;margin-bottom:5px}.choice{width:100%;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:8px 0;text-align:left;font:inherit;color:#263936;cursor:pointer;min-height:54px}.choice.selected{background:var(--mint);border:3px solid var(--ink);padding:14px 16px}.choice .tag{float:right;font-size:13px;font-weight:900;color:var(--ink)}.primary,.secondary,.back,.danger{width:100%;border-radius:18px;padding:16px 18px;margin:10px 0;font-size:17px;font-weight:900;cursor:pointer;min-height:54px}.primary{background:var(--ink);color:#fff;border:2px solid var(--ink)}.secondary{background:var(--mint);color:var(--ink);border:2px solid transparent}.back{background:#fff;color:var(--ink);border:1px solid var(--line)}.danger{background:#fff;color:var(--danger);border:1px solid #d9aaaa}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field,select.field,textarea.field{width:100%;padding:15px;border:1px solid #cbd8d4;border-radius:14px;font:inherit;margin:7px 0 13px;background:#fff;color:#263936;min-height:50px}.field[type=checkbox]{width:auto;min-height:0;margin-right:8px}.label{font-weight:800;color:var(--ink);display:block;margin-top:12px}.notice{border-left:5px solid var(--gold);background:#f7faf8;padding:15px;border-radius:12px;margin:16px 0;color:#526562}.summary{border-left:4px solid var(--mint);padding:8px 0 8px 14px;margin:10px 0}.summary b{color:var(--ink)}.pill{display:inline-block;background:var(--mint);color:var(--ink);font-weight:800;border-radius:999px;padding:7px 11px;margin:4px 4px 4px 0;font-size:14px}.statusbar{background:#f7faf8;border-radius:16px;padding:13px 15px;margin:11px 0;color:var(--ink);font-weight:750}.done-card{background:var(--mint);border:2px solid var(--ink)}.bottom-note{text-align:center;color:var(--muted);font-size:14px;margin-top:22px}.hidden{display:none!important}.inlinecheck{display:flex;align-items:center;gap:7px;margin:10px 0}.inlinecheck input{width:22px;height:22px}.moneyline{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:9px 0}.moneyline:last-child{border-bottom:0}.empty{padding:18px;text-align:center;color:var(--muted)}.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1;min-width:120px}.photo{height:220px;border:2px dashed #cbd8d4;border-radius:22px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:#fff;margin:18px 0;cursor:pointer}.photo img{width:100%;height:100%;object-fit:cover}@media(max-width:520px){.hero{font-size:38px}.h1{font-size:30px}.row{grid-template-columns:1fr}.brand{font-size:17px}.tab{padding:10px 12px;font-size:14px}.top{gap:6px}.wrap{padding-left:16px;padding-right:16px}}
</style></head><body>
<header class="top"><div class="brand">OUR WEDDING 💚</div><div class="tabs" id="tabs"><button class="tab" data-mode="home">Home</button><button class="tab" data-mode="dream">Dream</button><button class="tab" data-mode="plan">Plan</button></div></header>
<main class="wrap" id="app"></main><input id="photoInput" type="file" accept="image/*" class="hidden">
<script>
'use strict';
const KEY='ourWeddingFinalV1';
const VERSION=4;
const uid=p=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
const fresh=()=>({schemaVersion:VERSION,onboard:false,people:{a:'',alabel:'Bride',acustom:'',b:'',blabel:'Partner',bcustom:''},date:'',dateUnknown:false,dateIdea:'',area:'',areaUnknown:false,size:'',budget:'',budgetUnknown:false,photo:'',mode:'landing',route:'welcome',lastDream:'dreamHome',lastPlan:'planHome',history:[],guestEstimate:'',dream:{},considering:{},chosen:{},explore:{},events:{},plan:{choices:{},funds:{haveNow:'',expectToAdd:'',promised:'',given:'',otherExpected:'',notes:''},invites:{method:'',steps:{}},vendors:[],stuffItems:[],giftsReceived:[],giftsGiven:[],travel:{type:'Still considering',destination:'',startDate:'',endDate:'',budget:'',transport:'',lodging:'',reservations:'',payments:'',deadlines:'',remaining:'',notes:'',status:'Considering'},weddingDay:{timeline:[],responsibilities:[],bring:[],transport:'',endPlan:''},active:{vendor:null,stuff:null,giftReceived:null,giftGiven:null,timeline:null,responsibility:null}},wins:[]});
function asObj(v,d={}){return v&&typeof v==='object'&&!Array.isArray(v)?v:d}function asArr(v){return Array.isArray(v)?v:[]}
function migrate(raw){const s=fresh(); if(!raw||typeof raw!=='object')return s;
 Object.assign(s,raw);s.people=Object.assign(s.people,asObj(raw.people));s.dream=asObj(raw.dream);s.considering=asObj(raw.considering);s.chosen=asObj(raw.chosen);s.explore=asObj(raw.explore);s.events=asObj(raw.events);s.plan=Object.assign(s.plan,asObj(raw.plan));s.plan.choices=asObj(s.plan.choices);s.plan.funds=Object.assign(fresh().plan.funds,asObj(s.plan.funds));s.plan.invites=Object.assign({method:s.plan.choices.inviteMethod||'',steps:{}},asObj(s.plan.invites));s.plan.vendors=asArr(s.plan.vendors);s.plan.stuffItems=asArr(s.plan.stuffItems);s.plan.giftsReceived=asArr(s.plan.giftsReceived);s.plan.giftsGiven=asArr(s.plan.giftsGiven);s.plan.travel=Object.assign(fresh().plan.travel,asObj(s.plan.travel));if(!s.plan.travel.type)s.plan.travel.type='Still considering';s.plan.weddingDay=Object.assign(fresh().plan.weddingDay,asObj(s.plan.weddingDay));s.plan.weddingDay.timeline=asArr(s.plan.weddingDay.timeline);s.plan.weddingDay.responsibilities=asArr(s.plan.weddingDay.responsibilities);s.plan.weddingDay.bring=asArr(s.plan.weddingDay.bring);s.plan.active=Object.assign(fresh().plan.active,asObj(s.plan.active));s.wins=asArr(s.wins);
 // migrate prior Stuff fields without discarding them
 s.plan.stuffItems=s.plan.stuffItems.map(x=>Object.assign({id:uid('stuff'),name:'',method:'',status:'Not Started',notes:'',history:{}},x));
 s.schemaVersion=VERSION;return s}
let state;try{state=migrate(JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){state=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn('Wedding planner could not access browser storage in this viewing context.',e)}}
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>{const x=num(n);return x?x.toLocaleString(undefined,{style:'currency',currency:'USD'}):'$0'}; const num=v=>Number(String(v??'').replace(/[^0-9.-]/g,''))||0;
function title(t,sub='',eye=''){return `${eye?`<div class="eyebrow">${esc(eye)}</div>`:''}<div class="h1">${t}</div>${sub?`<div class="lead">${sub}</div>`:''}`}
function btn(label,action,kind='primary'){return `<button class="${kind}" data-action="${esc(action)}">${label}</button>`}function card(label,desc,route){return `<button class="card" data-route="${esc(route)}"><strong>${label}</strong>${desc?`<span>${desc}</span>`:''}</button>`}function choice(label,key,selected=false){return `<button class="choice ${selected?'selected':''}" data-choice="${esc(key)}">${esc(label)}${selected?'<span class="tag">✓</span>':''}</button>`}
function back(){return state.history.length?btn('← BACK','back','back'):''}function go(route,opt={}){const {push=true,mode=null}=opt;if(push&&state.route!==route)state.history.push({route:state.route,mode:state.mode});state.route=route;if(mode)state.mode=mode;if(state.mode==='dream')state.lastDream=route;if(state.mode==='plan')state.lastPlan=route;save();render()}function doBack(){const h=state.history.pop();if(h){state.route=h.route;state.mode=h.mode;save();render()}}
function switchMode(m){if(!state.onboard)return;if(state.mode==='dream')state.lastDream=state.route;if(state.mode==='plan')state.lastPlan=state.route;state.history=[];if(m==='home')return go('plannerHome',{push:false,mode:'home'});if(m==='dream')return go(state.lastDream||'dreamHome',{push:false,mode:'dream'});go(state.lastPlan||'planHome',{push:false,mode:'plan'})}
function f(label,id,val='',type='text',extra=''){return `<label class="label" for="${id}">${label}</label><input class="field" id="${id}" type="${type}" value="${esc(val)}" ${extra}>`}function ta(label,id,val=''){return `<label class="label" for="${id}">${label}</label><textarea class="field" id="${id}" rows="3">${esc(val)}</textarea>`}function sel(label,id,val,opts){return `<label class="label" for="${id}">${label}</label><select class="field" id="${id}">${opts.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
function onboarding(){const r=state.route;if(r==='welcome')return `<div class="eyebrow">OUR WEDDING</div><div class="hero">I SAID YES!</div><div class="subhero">...now what?</div><div class="lead">You don’t have to know everything yet.<br>Let’s start with your wedding. 💚</div>${btn('MAKE IT OURS →','nextPeople')}`;if(r==='people')return `${title('First things first…','Who is getting married?')}${f('Your name','a',state.people.a)}${sel('What would you like us to call you?','alabel',state.people.alabel,['Bride','Groom','Spouse','Partner','Custom'])}<label class="label ${state.people.alabel==='Custom'?'':'hidden'}" id="acustomLabel" for="acustom">Your custom title</label><input class="field ${state.people.alabel==='Custom'?'':'hidden'}" id="acustom" value="${esc(state.people.acustom)}">${f('Who are you marrying?','b',state.people.b)}${sel('What would you like us to call them?','blabel',state.people.blabel,['Bride','Groom','Spouse','Partner','Custom'])}<label class="label ${state.people.blabel==='Custom'?'':'hidden'}" id="bcustomLabel" for="bcustom">Their custom title</label><input class="field ${state.people.blabel==='Custom'?'':'hidden'}" id="bcustom" value="${esc(state.people.bcustom)}">${btn('CONTINUE','savePeople')}${back()}`;if(r==='date')return `${title('When’s the big day? 💚')}${f('Wedding date','date',state.date,'date')}<label class="inlinecheck"><input type="checkbox" id="dateUnknown" ${state.dateUnknown?'checked':''}>We’re still deciding</label>${f('General idea, if you have one','dateIdea',state.dateIdea,'text','placeholder="Season / month / year / not yet"')}<div class="small">Whatever you know right now is enough. You can change it anytime.</div>${btn('CONTINUE','saveDate')}${back()}`;if(r==='area')return `${title('Where are you imagining your wedding?')}${f('City / Area','area',state.area)}<label class="inlinecheck"><input type="checkbox" id="areaUnknown" ${state.areaUnknown?'checked':''}>We’re still deciding</label>${btn('CONTINUE','saveArea')}${back()}`;if(r==='size')return `${title('When you picture your wedding, how big does it feel?')}${['Small & intimate','Somewhere in the middle','A big celebration','I’m not sure yet'].map(x=>choice(x,x,state.size===x)).join('')}${btn('CONTINUE','saveSize')}${back()}`;if(r==='budget')return `${title('What are you comfortable planning to spend?')}${f('Wedding budget','budget',state.budget,'text','inputmode="decimal" placeholder="$"')}<label class="inlinecheck"><input type="checkbox" id="budgetUnknown" ${state.budgetUnknown?'checked':''}>We don’t know yet</label><div class="notice">Whatever your number, we’ll help you plan the wedding you want to experience. 💚</div>${btn('CONTINUE','saveBudget')}${back()}`;return `${title('Look at you. You’re planning a wedding. 💚','That’s enough for now. We’ll ask for other details when they actually become useful. You don’t need to figure everything out today.')}${btn('SEE OUR WEDDING →','finishOnboard')}${back()}`}
function landing(){const names=[state.people.a,state.people.b].filter(Boolean).join(' & ')||'Our Wedding';return `${title('I SAID YES!','...now what?')}<div class="photo" id="photoBox">${state.photo?`<img src="${state.photo}" alt="Wedding inspiration">`:'+ Add a photo that makes this feel like your wedding 💚'}</div><div class="h1">${esc(names)}</div>${state.date&&!state.dateUnknown?`<div class="lead">${new Date(state.date+'T12:00:00').toLocaleDateString()}</div>`:''}${btn('ENTER OUR WEDDING PLANNER →','enterHome')}${btn('ABOUT OUR WEDDING GUIDE →','guideInfo','secondary')}`}
function guideInfo(){return `${title('Our Wedding Guide','The Guide teaches. The Planner tracks.','GUIDE + PLANNER')}<div class="card"><strong>Our Wedding Guide by Lanai Dameron</strong><span>Use the Guide for explanations, context, questions to ask, and help understanding decisions. Use this Planner to hold what applies to your wedding.</span></div><div class="notice">A direct Guide destination is not configured in this file, so the planner does not invent one.</div>${btn('BACK TO PLANNER HOME →','enterHome','secondary')}${back()}`}
const dreamData={ceremonyLocation:['A wedding venue','A place of worship','A courthouse','Outdoors','At someone’s home','A restaurant, hotel, or event space','Somewhere else','I don’t know yet'],timeOfDay:['Morning','Afternoon','Around sunset','Evening','Late night','I’m not sure yet'],ceremonyFeel:['Romantic & emotional','Relaxed & easygoing','Elegant & polished','Fun & full of personality','Traditional & meaningful','Simple & intimate','A mix of these','I’m not sure yet'],ceremonySurroundings:['Flowers or greenery','Candles or beautiful lighting','An arch or something framing us','A beautiful view or natural setting','A space that’s beautiful on its own','Something meaningful or personal to us','A mix of these','I want to play','I haven’t pictured this part yet'],gettingReady:["What I’m wearing",'Shoes & accessories','Hair','Makeup / grooming',"Who I’m getting ready with","Where I’m getting ready",'Honestly, all of it','I want to play','I haven’t pictured this part yet'],attire:['Gown / dress','Suit / tux','Jumpsuit','Separates','Cultural / traditional attire','Something unconventional','More than one look','I want to play','I haven’t pictured this part yet'],firstLook:['See each other for the first time at the ceremony','A private first look','A first touch without seeing each other','Spend time together before the ceremony','Something different','I want to play','I haven’t pictured this part yet'],entrance:['Walk down an aisle','Enter together','Already be there','Something different','I want to play','I haven’t pictured this part yet'],ceremonyContents:['Vows','Rings','A reading','Music','A tradition','Something symbolic or personal','Simple and private','I want to explore','I haven’t pictured this part yet'],celebration:['A big reception / party','Dinner and celebrate','Relaxed and casual','Small and intimate','Just us','Something different','I want to play','I haven’t pictured this part yet']};
const dreamLabels={ceremonyLocation:'Where are you imagining your ceremony?',timeOfDay:'When you picture getting married, what time of day is it?',ceremonyFeel:'What does the ceremony feel like?',ceremonySurroundings:'What do you see around you?',gettingReady:'What have you imagined about getting ready?',attire:'What do you picture yourself wearing?',firstLook:'When do you picture seeing each other?',entrance:'How do you picture entering?',ceremonyContents:'What belongs in the ceremony?',celebration:'What happens after you’re married?'};
const multiDream=new Set(['gettingReady','ceremonyContents']);
function dreamHome(){return `${title('Let’s picture your wedding. 💚','Explore anything you want. Looking is not deciding, and Dream and Plan are two views of the same wedding.','DREAM')}${card('Our Wedding Day','Picture the ceremony and celebration.','dream:ceremonyLocation')}${card('Before the Wedding','Parties, showers, rehearsals, welcome gatherings, or your own thing.','beforeHome')}${card('After the Wedding','After-party, brunch, honeymoon, mini-moon, staycation, or your own thing.','afterHome')}`}
function dreamScreen(key){const vals=multiDream.has(key)?asArr(state.dream[key]):state.dream[key]||'';return `${title(dreamLabels[key]||'Dream','Exploring does not create a planning obligation.','DREAM')}${dreamData[key].map(x=>choice(x,x,multiDream.has(key)?vals.includes(x):vals===x)).join('')}${!multiDream.has(key)&&vals&&!/not sure|haven.t pictured|play|explore/i.test(vals)?`<div class="seg">${btn(state.considering[key]===vals?'CONSIDERING ✓':'CONSIDERING',`consider:${key}`,'secondary')}${btn(state.chosen[key]===vals?'CHOSEN ✓':'CHOSEN / DECIDED',`choose:${key}`)}</div>`:''}${btn('KEEP IMAGINING →',`dreamNext:${key}`)}${back()}`}
const beforeEvents=[['engagement','Engagement party'],['shower','Wedding / bridal shower'],['bach','Bachelor / bachelorette celebration(s)'],['welcome','Welcome party'],['rehearsal','Rehearsal'],['rehearsalDinner','Rehearsal dinner / gathering'],['tradition','Family / cultural / traditional celebration'],['customBefore','Custom event']];const afterEvents=[['afterparty','After-party'],['farewell','Farewell breakfast / brunch'],['honeymoon','Honeymoon'],['minimoon','Mini-moon'],['staycation','Romantic staycation'],['customAfter','Other / custom event']];
function eventHome(which){const arr=which==='before'?beforeEvents:afterEvents;return `${title(which==='before'?'What happens before the wedding? 💚':'What happens after the wedding? 💚','Having an event does not mean you have to be the one planning it.',which==='before'?'BEFORE THE WEDDING':'AFTER THE WEDDING')}${arr.map(([id,n])=>card(n,state.events[id]?.owner||'Tap to explore',`event:${id}`)).join('')}${back()}`}
function eventScreen(id){const all=[...beforeEvents,...afterEvents], defaultName=all.find(x=>x[0]===id)?.[1]||'Our event',e=state.events[id]||{};const owner=['We’re planning it','We’re planning it with someone','Someone else is planning it','We know we’re having it, but details are still fuzzy','We’re just thinking about it','Not interested'];return `${title(e.name||defaultName,'First decide how this event fits your wedding.','EVENT')}${id.startsWith('custom')?f('Event name','eventName',e.name||''):''}${owner.map(x=>choice(x,x,e.owner===x)).join('')}${e.owner&&e.owner!=='Not interested'&&!/thinking|fuzzy/i.test(e.owner)?`${f('Date / timing','eventDate',e.date||'')}${f('Location','eventLocation',e.location||'')}${f('Estimated cost','eventEstimate',e.estimatedCost||'','text','inputmode="decimal"')}${f('Committed / actual cost','eventActual',e.actualCost||'','text','inputmode="decimal"')}${ta('What matters / what needs to happen','eventTasks',e.tasks||'')}${ta('Notes','eventNotes',e.notes||'')}`:''}${e.owner==='Someone else is planning it'?'<div class="notice">This stays visible for awareness, but it will not create the same task burden as an event you are personally planning.</div>':''}${btn('SAVE EVENT →',`saveEvent:${id}`)}${back()}`}
function activeCommittedEvents(){return [...beforeEvents,...afterEvents].map(([id,name])=>({id,name,e:state.events[id]})).filter(x=>x.e&&x.e.owner&&!['Not interested','We’re just thinking about it'].includes(x.e.owner))}
function normalizeDate(v){if(!v)return null;const d=/^\d{4}-\d{2}-\d{2}$/.test(v)?new Date(v+'T12:00:00'):new Date(v);return isNaN(d)?null:d}function dayDiff(d){if(!d)return null;const a=new Date();a.setHours(12,0,0,0);return Math.ceil((d-a)/86400000)}function dueText(v){const d=normalizeDate(v),n=dayDiff(d);if(!d)return'';if(n<0)return'Past due · '+d.toLocaleDateString();if(n===0)return'Today';if(n===1)return'Tomorrow';if(n<=30)return`in ${n} days · ${d.toLocaleDateString()}`;return'Due '+d.toLocaleDateString()}
function expenses(){const out=[];state.plan.vendors.forEach(v=>{const total=num(v.contractedPrice||v.quote);if(total)out.push({id:'vendor:'+v.id,label:v.businessName||v.category||'Vendor',expected:num(v.quote),committed:num(v.contractedPrice),paid:(v.depositPaid?num(v.depositAmount):0)+(v.finalPaid?num(v.remainingBalance):0),due:v.finalPaid?'':(v.depositRequired&&!v.depositPaid?v.depositDue:v.finalDue),source:'Vendor'});});state.plan.stuffItems.forEach(x=>{if(['Skip','Already Handled'].includes(x.method)||x.linkedVendorId)return;const c=num(x.actualCost||x.cost),e=num(x.expectedCost||x.cost);if(e||c)out.push({id:'stuff:'+x.id,label:x.name,expected:e,committed:c,paid:x.paid?c:0,due:x.paymentDue||'',source:x.method})});activeCommittedEvents().forEach(({id,name,e})=>{if(num(e.estimatedCost)||num(e.actualCost))out.push({id:'event:'+id,label:e.name||name,expected:num(e.estimatedCost),committed:num(e.actualCost),paid:num(e.paid),due:e.paymentDue||'',source:'Event'})});const t=state.plan.travel;if(t.type&&!/Still considering|Skip/.test(t.type)&&(num(t.budget)||num(t.payments)))out.push({id:'travel',label:t.type,expected:num(t.budget),committed:num(t.payments),paid:num(t.paid),due:t.paymentDue||'',source:'Travel'});return out}
function dashboards(){const left=[],orders=[],moneyDue=[],accomplished=[];state.plan.stuffItems.forEach(x=>{if(x.method==='Skip'||x.status==='Skipped')return;if(x.method==='Already Handled'||x.status==='Complete'){accomplished.push(x.name);return}if(x.method==='Delegate'){if(!/Complete|Confirmed/.test(x.delegateStatus||x.status||''))left.push({label:`Follow up: ${x.name}`,due:x.delegateDue||x.neededBy||'',route:'planStuff'});return}left.push({label:x.name,due:x.neededBy||'',route:'planStuff'});if(x.method==='Buy'&&x.ordered&&!x.received)orders.push({label:x.name,due:x.expectedDelivery||x.delivery||''})});state.plan.vendors.forEach(v=>{if(v.completed){accomplished.push(v.businessName||v.category);return}if(v.status==='Chosen'&&!v.contractSigned)left.push({label:`Finish ${v.businessName||v.category} details`,due:v.depositDue||'',route:'planVendors'});if(v.depositRequired&&!v.depositPaid&&v.depositDue)moneyDue.push({label:`${v.businessName||v.category} deposit`,due:v.depositDue,amount:num(v.depositAmount)});if(!v.finalPaid&&v.finalDue)moneyDue.push({label:`${v.businessName||v.category} final payment`,due:v.finalDue,amount:num(v.remainingBalance)})});expenses().forEach(e=>{if(e.due&&!moneyDue.some(x=>x.label.startsWith(e.label)))moneyDue.push({label:e.label,due:e.due,amount:Math.max(0,e.committed-e.paid)})});state.plan.weddingDay.responsibilities.forEach(r=>{if(r.completed)accomplished.push(`${r.person}: ${r.task}`);else left.push({label:`${r.person}: ${r.task}`,due:r.due||'',route:'planWeddingDay'})});return{left,orders,moneyDue,accomplished}}
function plannerHome(){const d=dashboards(),today=d.left.filter(x=>{const n=dayDiff(normalizeDate(x.due));return n===null||n<=2}).slice(0,3),week=d.left.filter(x=>{const n=dayDiff(normalizeDate(x.due));return n!==null&&n>=0&&n<=7}),month=d.left.filter(x=>{const n=dayDiff(normalizeDate(x.due));return n!==null&&n>7&&n<=30});const wins=[...state.wins,...d.accomplished].slice(-5).reverse();return `${title(`Hi, ${esc(state.people.a||'there')} 💚`,'Your planner only surfaces work that belongs to this wedding.','HOME')}<div class="eyebrow">RIGHT NOW</div>${today.length?today.map(x=>card(x.label,dueText(x.due)||'Ready when you are',x.route)).join(''):'<div class="statusbar">Nothing needs your attention right now.</div>'}<div class="eyebrow">THIS WEEK</div>${week.length?week.map(x=>card(x.label,dueText(x.due),x.route)).join(''):'<div class="statusbar">Nothing yet.</div>'}<div class="eyebrow">THIS MONTH</div>${month.length?month.map(x=>card(x.label,dueText(x.due),x.route)).join(''):'<div class="statusbar">Nothing yet.</div>'}<div class="eyebrow">MONEY COMING UP</div>${d.moneyDue.length?d.moneyDue.slice(0,5).map(x=>card(x.label,`${x.amount?money(x.amount)+' · ':''}${dueText(x.due)}`,'planMoney')).join(''):'<div class="statusbar">Nothing yet.</div>'}<div class="eyebrow">ORDERS TO WATCH</div>${d.orders.length?d.orders.map(x=>card(x.label,dueText(x.due)||'Ordered','planStuff')).join(''):'<div class="statusbar">Nothing yet.</div>'}<div class="eyebrow">RECENT WINS ✨</div>${wins.length?wins.map(x=>`<div class="statusbar">${esc(x)}</div>`).join(''):'<div class="statusbar">You started planning your wedding.</div>'}${card('WHAT’S LEFT →',`${d.left.length} active item${d.left.length===1?'':'s'}`,'whatsLeft')}${card('ALREADY ACCOMPLISHED →',`${d.accomplished.length} saved accomplishment${d.accomplished.length===1?'':'s'}`,'alreadyAccomplished')}`}

function planMoney(){const ex=expenses(),expected=ex.reduce((a,x)=>a+x.expected,0),committed=ex.reduce((a,x)=>a+x.committed,0),paid=ex.reduce((a,x)=>a+x.paid,0),out=Math.max(0,committed-paid),budget=num(state.budget),funds=state.plan.funds||fresh().plan.funds,availableNow=num(funds.haveNow)+num(funds.given),expectedFunding=availableNow+num(funds.expectToAdd)+num(funds.promised)+num(funds.otherExpected),stillNeeded=budget?Math.max(0,budget-expectedFunding):0,cushion=budget?Math.max(0,expectedFunding-budget):0;return `${title('Money','See both sides: what the wedding may cost and what money you actually have or expect to have.','PLAN')}<div class="h2">Our Wedding Funds</div>${f('Wedding budget — what we want to spend','moneyBudget',state.budget,'text','inputmode="decimal" placeholder="$"')}${f('Money we have available now','moneyHaveNow',funds.haveNow,'text','inputmode="decimal" placeholder="$"')}${f('Money we expect to add or save','moneyExpect',funds.expectToAdd,'text','inputmode="decimal" placeholder="$"')}${f('Money promised to us','moneyPromised',funds.promised,'text','inputmode="decimal" placeholder="$"')}${f('Money already given to us','moneyGiven',funds.given,'text','inputmode="decimal" placeholder="$"')}${f('Other wedding money we expect','moneyOther',funds.otherExpected,'text','inputmode="decimal" placeholder="$"')}${ta('Notes about where the money is coming from','moneyFundNotes',funds.notes)}${btn('SAVE WEDDING FUNDS →','saveMoneyFunds')}<div class="card"><div class="moneyline"><b>Available now</b><span>${money(availableNow)}</span></div><div class="moneyline"><b>Total expected funding</b><span>${money(expectedFunding)}</span></div><div class="moneyline"><b>Wedding budget</b><span>${budget?money(budget):'Not set'}</span></div>${budget?`<div class="moneyline"><b>${stillNeeded?'Still needed to fully fund it':'Extra cushion'}</b><span>${money(stillNeeded||cushion)}</span></div>`:''}</div><div class="h2">What the Wedding Is Costing</div><div class="card"><div function planWeddingDay(){const w=state.plan.weddingDay;return `${title('Wedding Day','Turn decisions into timing, ownership, things, transportation, and the end-of-night plan.','PLAN')}<div class="h2">Timeline</div>${btn('＋ ADD TIMELINE ITEM','newTimeline','secondary')}${w.timeline.map(x=>`<button class="card" data-open-timeline="${x.id}"><strong>${esc(x.time||'Time')} · ${esc(x.title||'Timeline item')}</strong><span>${esc(x.location||'')}</span></button>`).join('')}<div class="h2">Assign people & responsibilities</div>${btn('＋ ADD RESPONSIBILITY','newResponsibility','secondary')}${w.responsibilities.map(x=>`<button class="card ${x.completed?'done-card':''}" data-open-resp="${x.id}"><strong>${esc(x.person||'Person')} · ${esc(x.task||'Responsibility')}</strong><span>${esc(x.time||x.due||'')}${x.completed?' · confirmed':''}</span></button>`).join('')}<div class="h2">Things to bring</div>${ta('One per line','wBring',w.bring.join('\n'))}${ta('Transportation / setup plan','wTransport',w.transport)}${ta('End-of-night plan','wEnd',w.endPlan)}${btn('SAVE WEDDING DAY LOGISTICS →','saveWeddingDay')}${back()}`}
function timelineForm(){const x=state.plan.weddingDay.timeline.find(a=>a.id===state.plan.active.timeline);if(!x)return planWeddingDay();return `${title('Timeline Item','','WEDDING DAY')}${f('Time','tlTime',x.time||'')}${f('Title / moment','tlTitle',x.title||'')}${f('Location','tlLocation',x.location||'')}${ta('Notes','tlNotes',x.notes||'')}${btn('SAVE TIMELINE ITEM →','saveTimeline')}${btn('DELETE TIMELINE ITEM','deleteTimeline','danger')}${btn('BACK TO WEDDING DAY →','weddingBack','secondary')}`}
function responsibilityForm(){const x=state.plan.weddingDay.responsibilities.find(a=>a.id===state.plan.active.responsibility);if(!x)return planWeddingDay();return `${title('Responsibility','','WEDDING DAY')}${f('Person','rPerson',x.person||'')}${f('Responsibility / task','rTask',x.task||'')}${f('Relevant time','rTime',x.time||'')}${f('Relevant location','rLocation',x.location||'')}${f('Needed-by / due date','rDue',x.due||'','date')}${f('Contact / details','rContact',x.contact||'')}${ta('Notes','rNotes',x.notes||'')}${sel('Status','rStatus',x.status||'Assigned',['Assigned','In progress','Confirmed','Complete'])}<label class="inlinecheck"><input id="rCompleted" type="checkbox" ${x.completed?'checked':''}>Completed / confirmed</label>${btn('SAVE RESPONSIBILITY →','saveResponsibility')}${btn('DELETE RESPONSIBILITY','deleteResponsibility','danger')}${btn('BACK TO WEDDING DAY →','weddingBack','secondary')}`}
function render(){const app=$('#app');$('#tabs').style.visibility=state.onboard?'visible':'hidden';$$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===state.mode));let o='';const r=state.route;if(!state.onboard)o=onboarding();else if(r==='landing')o=landing();else if(r==='guideInfo')o=guideInfo();else if(r==='plannerHome')o=plannerHome();else if(r==='whatsLeft')o=whatsLeft();else if(r==='alreadyAccomplished')o=alreadyAccomplished();else if(r==='dreamHome')o=dreamHome();else if(r.startsWith('dream:'))o=dreamScreen(r.split(':')[1]);else if(r==='beforeHome')o=eventHome('before');else if(r==='afterHome')o=eventHome('after');else if(r.startsWith('event:'))o=eventScreen(r.split(':')[1]);else if(r==='planHome')o=planHome();else if(r==='planGuests')o=planGuests();else if(r==='planInvites')o=planInvites();else if(r==='planMoney')o=planMoney();else if(r==='planVendors')o=planVendors();else if(r==='vendorForm')o=vendorForm();else if(r==='planStuff')o=planStuff();else if(r==='stuffForm')o=stuffForm();else if(r==='planGifts')o=planGifts();else if(r==='giftReceivedForm')o=giftForm('received');else if(r==='giftGivenForm')o=giftForm('given');else if(r==='planEvents')o=planEvents();else if(r==='planHoneymoon')o=planHoneymoon();else if(r==='planWeddingDay')o=planWeddingDay();else if(r==='timelineForm')o=timelineForm();else if(r==='responsibilityForm')o=responsibilityForm();else o=planHome();app.innerHTML=o;bind();window.scrollTo(0,0)}
function val(id){return $('#'+id)?.value?.trim()||''}function checked(id){return !!$('#'+id)?.checked}
function recordWin(text){if(text&&!state.wins.includes(text)){state.wins.push(text);if(state.wins.length>50)state.wins.shift()}}
function saveVendor(){const v=state.plan.vendors.find(x=>x.id===state.plan.active.vendor);Object.assign(v,{category:val('vCategory'),customCategory:val('vCustom'),businessName:val('vBusiness'),contactPerson:val('vContact'),phone:val('vPhone'),email:val('vEmail'),website:val('vWebsite'),address:val('vAddress'),status:val('vStatus'),quote:val('vQuote'),contractedPrice:val('vContracted'),contractSigned:checked('vContract'),contractDate:val('vContractDate'),depositRequired:checked('vDepositReq'),depositAmount:val('vDepositAmount'),depositDue:val('vDepositDue'),depositPaid:checked('vDepositPaid'),depositPaidDate:val('vDepositPaidDate'),remainingBalance:val('vBalance'),finalDue:val('vFinalDue'),finalPaid:checked('vFinalPaid'),meetings:val('vMeetings'),providing:val('vProviding'),deliverables:val('vDeliverables'),notes:val('vNotes'),completed:checked('vCompleted')});if(v.completed)recordWin(`${v.businessName||v.category} finished`);save();go('planVendors',{push:false,mode:'plan'})}
function saveStuff(){const x=state.plan.stuffItems.find(a=>a.id===state.plan.active.stuff);x.history=x.history||{};const m=x.method;x.notes=val('sNotes');x.what=val('sWhat')||x.what||x.name;x.expectedCost=val('sExpected');x.actualCost=val('sActual');x.paymentDue=val('sPayDue');x.neededBy=val('sNeeded');if(m==='Buy')Object.assign(x,{source:val('sSource'),ordered:checked('sOrdered'),orderDate:val('sOrderDate'),expectedDelivery:val('sDelivery'),received:checked('sReceived'),paid:checked('sPaid'),status:checked('sReceived')?'Complete':checked('sOrdered')?'Ordered':'Choosing'});if(m==='Hire'){Object.assign(x,{provider:val('sProvider'),contact:val('sContact'),contractStatus:val('sContract'),depositAmount:val('sDeposit'),status:checked('sComplete')?'Complete':'Choosing'});if(x.provider){let v=state.plan.vendors.find(v=>v.id===x.linkedVendorId)||state.plan.vendors.find(v=>v.businessName&&v.businessName.toLowerCase()===x.provider.toLowerCase());if(!v){v={id:uid('vendor'),category:'Other/custom vendor',customCategory:x.what||x.name,businessName:x.provider,status:'Considering'};state.plan.vendors.push(v)}x.linkedVendorId=v.id;v.customCategory=v.customCategory||x.what||x.name;v.quote=x.expectedCost||v.quote||'';v.contractedPrice=x.actualCost||v.contractedPrice||'';v.depositAmount=x.depositAmount||v.depositAmount||'';v.finalDue=x.paymentDue||v.finalDue||'';v.notes=[v.notes,x.notes].filter(Boolean).join(' | ')}}if(m==='DIY')Object.assign(x,{work:val('sWork'),materials:val('sMaterials'),materialsObtained:val('sObtained'),materialsStillNeeded:val('sStillNeeded'),worker:val('sWorker'),startBy:val('sStart'),progress:val('sProgress'),status:val('sProgress')==='Complete'?'Complete':'In Progress'});if(m==='Borrow')Object.assign(x,{source:val('sSource'),contact:val('sContact'),requested:checked('sRequested'),confirmed:checked('sConfirmed'),pickupDate:val('sPickup'),received:checked('sReceived'),returnRequired:checked('sReturnReq'),returnBy:val('sReturn'),returned:checked('sReturned'),status:checked('sReturned')||(!checked('sReturnReq')&&checked('sReceived'))?'Complete':'In Progress'});if(m==='Delegate')Object.assign(x,{personResponsible:val('sPerson'),contact:val('sContact'),responsibility:val('sResponsibility'),dateAssigned:val('sAssigned'),delegateDue:val('sNeeded'),delegateStatus:val('sDelegateStatus'),followUp:checked('sFollow'),status:val('sDelegateStatus')==='Complete'?'Complete':'Delegated'});if(m==='Already Handled')x.status='Complete';if(m==='Skip')x.status='Skipped';if(x.status==='Complete')recordWin(`${x.name} handled`);save();go('planStuff',{push:false,mode:'plan'})}
function saveGift(kind){const arr=kind==='received'?state.plan.giftsReceived:state.plan.giftsGiven,id=kind==='received'?state.plan.active.giftReceived:state.plan.active.giftGiven,g=arr.find(x=>x.id===id);if(kind==='received')Object.assign(g,{source:val('gSource'),giver:val('gGiver'),received:val('gReceived'),thankNeeded:checked('gThankNeeded'),thankSent:checked('gThankSent'),notes:val('gNotes')});else Object.assign(g,{recipient:val('gRecipient'),gift:val('gGift'),status:val('gStatus'),ready:checked('gReady'),given:checked('gGiven'),notes:val('gNotes')});save();go('planGifts',{push:false,mode:'plan'})}
function saveTravel(){const t=state.plan.travel;t.type=val('tType');if(!['Skip / not doing this','Still considering'].includes(t.type))Object.assign(t,{destination:val('tDestination'),startDate:val('tStart'),endDate:val('tEnd'),budget:val('tBudget'),transport:val('tTransport'),lodging:val('tLodging'),reservations:val('tReservations'),payments:val('tPayments'),paid:val('tPaid'),paymentDue:val('tPaymentDue'),deadlines:val('tDeadlines'),remaining:val('tRemaining'),notes:val('tNotes')});save();render()}
function bind(){$$('[data-mode]').forEach(x=>x.onclick=()=>switchMode(x.dataset.mode));$$('[data-route]').forEach(x=>x.onclick=()=>{const r=x.dataset.route,m=r.startsWith('plan')||['vendorForm','stuffForm','giftReceivedForm','giftGivenForm','timelineForm','responsibilityForm'].includes(r)?'plan':r.startsWith('dream')||['beforeHome','afterHome'].includes(r)||r.startsWith('event:')?'dream':null;go(r,{mode:m})});$$('[data-action]').forEach(x=>x.onclick=()=>act(x.dataset.action));$$('[data-choice]').forEach(x=>x.onclick=()=>selectChoice(x.dataset.choice));$$('[data-invite-step]').forEach(x=>x.onclick=()=>{const i=x.dataset.inviteStep;state.plan.invites.steps[i]=!state.plan.invites.steps[i];save();render()});$$('[data-open-vendor]').forEach(x=>x.onclick=()=>{state.plan.active.vendor=x.dataset.openVendor;save();go('vendorForm',{mode:'plan'})});$$('[data-open-stuff]').forEach(x=>x.onclick=()=>{state.plan.active.stuff=x.dataset.openStuff;save();go('stuffForm',{mode:'plan'})});$$('[data-open-gift-received]').forEach(x=>x.onclick=()=>{state.plan.active.giftReceived=x.dataset.openGiftReceived;go('giftReceivedForm',{mode:'plan'})});$$('[data-open-gift-given]').forEach(x=>x.onclick=()=>{state.plan.active.giftGiven=x.dataset.openGiftGiven;go('giftGivenForm',{mode:'plan'})});$$('[data-open-timeline]').forEach(x=>x.onclick=()=>{state.plan.active.timeline=x.dataset.openTimeline;go('timelineForm',{mode:'plan'})});$$('[data-open-resp]').forEach(x=>x.onclick=()=>{state.plan.active.responsibility=x.dataset.openResp;go('responsibilityForm',{mode:'plan'})});const al=$('#alabel'),bl=$('#blabel');if(al)al.onchange=()=>{$('#acustom').classList.toggle('hidden',al.value!=='Custom');$('#acustomLabel').classList.toggle('hidden',al.value!=='Custom')};if(bl)bl.onchange=()=>{$('#bcustom').classList.toggle('hidden',bl.value!=='Custom');$('#bcustomLabel').classList.toggle('hidden',bl.value!=='Custom')};const pb=$('#photoBox');if(pb)pb.onclick=()=>$('#photoInput').click();const tt=$('#tType');if(tt)tt.onchange=()=>{state.plan.travel.type=tt.value;save();render()}}
function selectChoice(v){const r=state.route;if(r==='size'){state.size=v;save();render();return}if(r.startsWith('dream:')){const k=r.split(':')[1];if(multiDream.has(k)){const a=asArr(state.dream[k]);state.dream[k]=a.includes(v)?a.filter(x=>x!==v):[...a,v]}else state.dream[k]=v;save();render();return}if(r.startsWith('event:')){const id=r.split(':')[1];state.events[id]=state.events[id]||{};state.events[id].owner=v;save();render();return}if(r==='planInvites'){state.plan.invites.method=v;state.plan.choices.inviteMethod=v;state.plan.invites.steps={};save();render();return}if(r==='stuffForm'){const x=state.plan.stuffItems.find(a=>a.id===state.plan.active.stuff);if(x.method&&x.method!==v){x.history[x.method]=Object.assign({},x); }x.method=v;if(v==='Already Handled')x.status='Complete';else if(v==='Skip')x.status='Skipped';else if(['Complete','Skipped'].includes(x.status))x.status='Not Started';save();render();return}}
function act(a){if(a==='back')return doBack();if(a==='nextPeople')return go('people');if(a==='savePeople'){state.people.a=val('a');state.people.b=val('b');state.people.alabel=val('alabel');state.people.blabel=val('blabel');state.people.acustom=state.people.alabel==='Custom'?val('acustom'):'';state.people.bcustom=state.people.blabel==='Custom'?val('bcustom'):'';save();return go('date')}if(a==='saveDate'){state.date=val('date');state.dateUnknown=checked('dateUnknown');state.dateIdea=val('dateIdea');save();return go('area')}if(a==='saveArea'){state.area=val('area');state.areaUnknown=checked('areaUnknown');save();return go('size')}if(a==='saveSize')return go('budget');if(a==='saveBudget'){state.budget=val('budget');state.budgetUnknown=checked('budgetUnknown');save();return go('onboardDone')}if(a==='finishOnboard'){state.onboard=true;state.mode='landing';state.route='landing';state.history=[];save();return render()}if(a==='enterHome'){state.history=[];return go('plannerHome',{push:false,mode:'home'})}if(a==='guideInfo')return go('guideInfo');if(a==='saveGuests'){state.guestEstimate=val('guestEstimate');save();recordWin('Guest estimate saved');return render()}if(a==='saveMoneyFunds'){state.budget=val('moneyBudget');state.budgetUnknown=!state.budget;state.plan.funds=Object.assign(state.plan.funds||{},{haveNow:val('moneyHaveNow'),expectToAdd:val('moneyExpect'),promised:val('moneyPromised'),given:val('moneyGiven'),otherExpected:val('moneyOther'),notes:val('moneyFundNotes')});save();return render()}if(a.startsWith('consider:')){const k=a.split(':')[1],v=state.dream[k];state.considering[k]=state.considering[k]===v?'':v;if(state.considering[k])state.chosen[k]='';save();return render()}if(a.startsWith('choose:')){const k=a.split(':')[1],v=state.dream[k];state.chosen[k]=state.chosen[k]===v?'':v;if(state.chosen[k]){state.considering[k]='';recordWin(`Decided: ${v}`)}save();return render()}if(a.startsWith('dreamNext:')){const keys=Object.keys(dreamData),k=a.split(':')[1],i=keys.indexOf(k);return i===keys.length-1?go('dreamHome'):go('dream:'+keys[i+1])}if(a.startsWith('saveEvent:')){const id=a.split(':')[1],e=state.events[id]||{};if($('#eventName'))e.name=val('eventName');if(e.owner&&e.owner!=='Not interested'&&!/thinking|fuzzy/i.test(e.owner))Object.assign(e,{date:val('eventDate'),location:val('eventLocation'),estimatedCost:val('eventEstimate'),actualCost:val('eventActual'),tasks:val('eventTasks'),notes:val('eventNotes')});state.events[id]=e;save();return go(beforeEvents.some(x=>x[0]===id)?'beforeHome':'afterHome',{push:false,mode:'dream'})}if(a==='newVendor'){const id=uid('vendor');state.plan.vendors.push({id,category:'Venue',customCategory:'',businessName:'',status:'Researching'});state.plan.active.vendor=id;save();return go('vendorForm',{mode:'plan'})}if(a==='saveVendor')return saveVendor();if(a==='deleteVendor'){if(confirm('Delete this vendor?')){state.plan.vendors=state.plan.vendors.filter(x=>x.id!==state.plan.active.vendor);state.plan.active.vendor=null;save();go('planVendors',{push:false,mode:'plan'})}return}if(a==='vendorsBack')return go('planVendors',{push:false,mode:'plan'});if(a==='newStuff'){const name=val('newStuffName');if(!name)return;const id=uid('stuff');state.plan.stuffItems.push({id,name,method:'',status:'Not Started',history:{}});state.plan.active.stuff=id;save();return go('stuffForm',{mode:'plan'})}if(a==='saveStuff')return saveStuff();if(a==='deleteStuff'){if(confirm('Delete this item?')){state.plan.stuffItems=state.plan.stuffItems.filter(x=>x.id!==state.plan.active.stuff);state.plan.active.stuff=null;save();go('planStuff',{push:false,mode:'plan'})}return}if(a==='stuffBack')return go('planStuff',{push:false,mode:'plan'});if(a==='newGiftReceived'){const id=uid('giftR');state.plan.giftsReceived.push({id});state.plan.active.giftReceived=id;save();return go('giftReceivedForm',{mode:'plan'})}if(a==='newGiftGiven'){const id=uid('giftG');state.plan.giftsGiven.push({id});state.plan.active.giftGiven=id;save();return go('giftGivenForm',{mode:'plan'})}if(a.startsWith('saveGift:'))return saveGift(a.split(':')[1]);if(a.startsWith('deleteGift:')){const k=a.split(':')[1];if(confirm('Delete this gift?')){if(k==='received')state.plan.giftsReceived=state.plan.giftsReceived.filter(x=>x.id!==state.plan.active.giftReceived);else state.plan.giftsGiven=state.plan.giftsGiven.filter(x=>x.id!==state.plan.active.giftGiven);save();go('planGifts',{push:false,mode:'plan'})}return}if(a==='giftsBack')return go('planGifts',{push:false,mode:'plan'});if(a==='giftPlanHome'){state.history=[];return go('planHome',{push:false,mode:'plan'})}if(a==='saveTravel')return saveTravel();if(a==='saveWeddingDay'){state.plan.weddingDay.bring=val('wBring').split('\n').map(x=>x.trim()).filter(Boolean);state.plan.weddingDay.transport=val('wTransport');state.plan.weddingDay.endPlan=val('wEnd');save();return render()}if(a==='newTimeline'){const id=uid('timeline');state.plan.weddingDay.timeline.push({id});state.plan.active.timeline=id;save();return go('timelineForm',{mode:'plan'})}if(a==='saveTimeline'){const x=state.plan.weddingDay.timeline.find(x=>x.id===state.plan.active.timeline);Object.assign(x,{time:val('tlTime'),title:val('tlTitle'),location:val('tlLocation'),notes:val('tlNotes')});save();return go('planWeddingDay',{push:false,mode:'plan'})}if(a==='deleteTimeline'){if(confirm('Delete this timeline item?')){state.plan.weddingDay.timeline=state.plan.weddingDay.timeline.filter(x=>x.id!==state.plan.active.timeline);save();go('planWeddingDay',{push:false,mode:'plan'})}return}if(a==='newResponsibility'){const id=uid('resp');state.plan.weddingDay.responsibilities.push({id,status:'Assigned'});state.plan.active.responsibility=id;save();return go('responsibilityForm',{mode:'plan'})}if(a==='saveResponsibility'){const x=state.plan.weddingDay.responsibilities.find(x=>x.id===state.plan.active.responsibility);Object.assign(x,{person:val('rPerson'),task:val('rTask'),time:val('rTime'),location:val('rLocation'),due:val('rDue'),contact:val('rContact'),notes:val('rNotes'),status:val('rStatus'),completed:checked('rCompleted')});if(x.completed)recordWin(`${x.person}: ${x.task} confirmed`);save();return go('planWeddingDay',{push:false,mode:'plan'})}if(a==='deleteResponsibility'){if(confirm('Delete this responsibility?')){state.plan.weddingDay.responsibilities=state.plan.weddingDay.responsibilities.filter(x=>x.id!==state.plan.active.responsibility);save();go('planWeddingDay',{push:false,mode:'plan'})}return}if(a==='weddingBack')return go('planWeddingDay',{push:false,mode:'plan'})}
